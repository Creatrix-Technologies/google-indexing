<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start free | GoogleIndexing.com</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
</head>
<body>
<div id="site-header" data-start="no"></div>
<main id="main" class="auth">
  <div class="panel">
    <h1>Start free</h1>
    <p class="muted mt1">A 14-day trial with 100 URL submissions, then 50 a month. No card needed.</p>

    <a class="btn btn-secondary btn-block mt3" href="first-run.html">
      <svg class="g-mark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.2z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.3-3 .7-4.3V14H4.5C3 17 2 20.4 2 24s1 7 2.5 10l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>
      Continue with Google
    </a>

    <div class="divider">or</div>

    <form action="first-run.html" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-hint" required>
        <p id="pw-hint" class="hint">8+ characters with upper, lower, number and a symbol.</p>
      </div>
      <button class="btn btn-primary btn-block mt3" type="submit">Create free account</button>
    </form>
    <p class="muted mt3">Already have an account? <a href="dashboard.html">Sign in</a></p>
  </div>
</main>
</body>
</html>
